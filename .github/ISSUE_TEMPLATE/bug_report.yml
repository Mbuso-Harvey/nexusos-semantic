name: 🐛 Bug Report
description: Report an issue or unexpected behavior in Agent Web Graph
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue! Please provide as much detail as possible.
  - type: dropdown
    id: substrate
    attributes:
      label: Affected Substrate
      options:
        - Web (WebDriver BiDi / CDP)
        - Desktop (Windows UIA / macOS AX)
        - Mobile (Android ADB / iOS WDA)
        - MCP Server (Stdio / SSE)
        - CLI / SEA Executable
        - Documentation / Web Presence
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: How can the issue be reproduced?
      placeholder: |
        1. Run 'awg crawl ...'
        2. Execute MCP query '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: doctor-output
    attributes:
      label: Diagnostic Information
      description: Output of running `awg doctor` or `pnpm check-env`.
      render: shell
